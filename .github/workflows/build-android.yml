name: Build PROSPER AI Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Install Capacitor Android
        run: npm install @capacitor/android

      - name: Install Capacitor assets
        run: npm install --save-dev @capacitor/assets

      - name: Prepare app icon
        run: |
          mkdir -p resources
          cp icon.png resources/icon.png

      - name: Create Android project
        run: npx cap add android

      - name: Generate app icon
        run: npx capacitor-assets generate --android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PROSPER-AI-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
