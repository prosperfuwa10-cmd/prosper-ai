<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PROSPER AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b0b0f;
      color: white;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 18px;
      text-align: center;
      background: #111118;
      border-bottom: 1px solid #292933;
      font-size: 22px;
      font-weight: bold;
    }

    header span {
      color: #7c5cff;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .message {
      max-width: 85%;
      padding: 13px 16px;
      margin-bottom: 14px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .ai {
      background: #181820;
      margin-right: auto;
    }

    .user {
      background: #6c4cff;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #111118;
      border-top: 1px solid #292933;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      outline: none;
      border-radius: 12px;
      background: #20202a;
      color: white;
      font-size: 16px;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      background: #6c4cff;
      color: white;
      font-weight: bold;
      font-size: 15px;
    }

    button:active {
      transform: scale(0.96);
    }
  </style>
</head>

<body>

  <header>
    🤖 <span>PROSPER AI</span>
  </header>

  <div id="chat">
    <div class="message ai">
      Hello! 👋 I'm PROSPER AI.

      I'm an AI assistant created by Fuwa Prosper Jesufemi.

      How can I help you today?
    </div>
  </div>

  <div class="input-area">
    <input
      id="messageInput"
      type="text"
      placeholder="Ask PROSPER AI anything..."
      onkeydown="if(event.key === 'Enter') sendMessage()"
    >

    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("messageInput");
      const chat = document.getElementById("chat");

      const message = input.value.trim();

      if (!message) return;

      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = message;

      chat.appendChild(userMessage);

      input.value = "";

      const aiMessage = document.createElement("div");
      aiMessage.className = "message ai";

      aiMessage.textContent =
        "I'm connected to the PROSPER AI interface. 🤖\n\n" +
        "The Gemini AI brain will be connected next.";

      chat.appendChild(aiMessage);

      chat.scrollTop = chat.scrollHeight;
    }
  </script>

</body>
</html>
